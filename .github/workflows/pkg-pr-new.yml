name: pkg-pr-new

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # pkg.pr.new needs its GitHub App installed on the repository to post the
    # preview-install comment, which only happens once this repo goes public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # pkg-pr-new is a pinned devDependency (never npx'd) so the CLI a PR
      # preview runs is exactly the one package-lock.json records.
      - run: npx --no-install pkg-pr-new publish
