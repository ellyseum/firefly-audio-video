name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 24 matches .nvmrc; 22 is the only other Node major the pinned dev
  # toolchain can run on at all — vitest 5, eslint 10 and undici 8 (used by
  # the test suite's HTTP mocks) each drop support for 18 and 20 in their own
  # `engines` field. Every gate below runs on both.
  lint:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  format:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check

  typecheck:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  build:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # An application bundling the built package without the optional storage
      # peers still builds, and each storage provider reports its missing peer.
      - run: npm run bundle-smoke

  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    # Populated even when the secret is absent (empty string), so the step
    # below can gate on it without ever referencing `secrets` directly in an
    # `if:` — GitHub Actions does not expose that context there at all.
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run coverage
      # Codecov account setup happens at the public flip; until then this
      # step is a no-op rather than a failing one. Uploaded once, from the
      # .nvmrc leg, so one PR gets one coverage comment, not two.
      - if: matrix.node-version == 24 && env.HAS_CODECOV_TOKEN == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # The one build the runtime-smoke matrix downloads, independent of whether
  # the build gate's Node 22 leg above passes — a portability failure there
  # must never take the smoke matrix down with it.
  build-dist-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7

  # Proves the published `engines: { node: '>=18' }` against the actual built
  # artifact, on every major from that floor through the current LTS. The
  # dist/ under test is built exactly once, above, on .nvmrc's Node — an
  # older major here only ever installs production dependencies and runs a
  # zero-dependency script, never the dev toolchain that dropped support for
  # it.
  runtime-smoke:
    needs: build-dist-artifact
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/runtime-smoke.mjs

  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download actionlint and verify its checksum
        run: |
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          chmod +x actionlint
      - run: ./actionlint -color

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # An advisory in dev-only tooling (build, lint, test) never ships in
      # the published package and must not block a release; an advisory in
      # a production dependency is what every consumer of this package
      # inherits, so that is what this reports on. The step never fails the
      # job: npm audit exits non-zero the moment it finds anything at any
      # severity, which would turn this into a required gate on the next
      # low-severity transitive advisory rather than a report.
      - name: npm audit (production dependencies)
        run: |
          npm audit --omit=dev --json > audit.json || true
          {
            echo '### npm audit — production dependencies'
            echo
            if [ ! -s audit.json ]; then
              echo 'npm audit did not produce a report.'
            else
              total=$(jq -r '.metadata.vulnerabilities.total // empty' audit.json)
              if [ -z "$total" ]; then
                echo 'npm audit did not produce a parseable report.'
              elif [ "$total" = "0" ]; then
                echo 'No advisories against a production dependency.'
              else
                noun=$([ "$total" = "1" ] && echo 'advisory' || echo 'advisories')
                echo "$total $noun against a production dependency:"
                echo
                echo '```'
                jq -r '.vulnerabilities[] | "\(.name) \(.severity): \(.via[0].title // .via[0])"' audit.json
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
