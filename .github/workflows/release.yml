name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every push and pull request, independent of the flags below: it
  # proves the package.json "files" allowlist still produces exactly the
  # public surface — the built dist/, LICENSE, README.md and package.json —
  # and nothing from the development tree. A dry-run pack, never a dry-run
  # publish: it never contacts the registry, so it keeps working on every
  # push between releases, while package.json still carries the released
  # version.
  pack-contents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-pack-contents.mjs

  # Maintains the release PR from conventional commits and, on merge, tags
  # and creates the GitHub Release. Runs only for pushes: on a pull request
  # there is no default-branch history yet for it to act on.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Gates both publish jobs: nothing reaches npm, on either channel, unless
  # every quality gate passes, the packed file list is exactly the public
  # surface, and the built package loads on each Node major from the
  # engines floor through the current LTS. Skipped while publishing is
  # disabled, since nothing downstream can run anyway.
  verify:
    if: github.event_name == 'push' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: node scripts/verify-pack-contents.mjs
      # The smoke runs below load the dist/ built above with only the
      # production dependencies installed, as a consumer has them, with no
      # optional storage peer; the dev toolchain cannot run on 18 or 20.
      - run: npm ci --omit=dev --ignore-scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18
      - run: node scripts/runtime-smoke.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: node scripts/runtime-smoke.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/runtime-smoke.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/runtime-smoke.mjs

  # Reads whether the package has ever shipped a stable @latest version, so
  # the very first publish is always the 0.1.0 release rather than a
  # prerelease landing ahead of it. Read-only and unauthenticated.
  check-npm-tag:
    if: github.event_name == 'push' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      has-latest: ${{ steps.check.outputs.has-latest }}
    steps:
      - id: check
        run: |
          if npm view firefly-audio-video@latest version >/dev/null 2>&1; then
            echo "has-latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no @latest version exists on npm yet — the next channel is skipped until the first stable release ships"
          fi

  # Stages the stable release to npm the moment release-please tags a
  # commit and `verify` passes on it, with provenance and no long-lived
  # token. The staged version keeps the default `latest` tag; it does not
  # go live until a maintainer approves it on npm with 2FA.
  publish-latest:
    needs: [release-please, verify]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/firefly-audio-video/v/${{ needs.release-please.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm stage publish --provenance --access public

  # Publishes every green push to main that is not itself a release commit
  # to the `next` dist-tag, so a dependent can track main without waiting
  # for a release PR. Never moves a dist-tag; @next simply catches up again
  # on the push after a stable release.
  publish-next:
    needs: [release-please, verify, check-npm-tag]
    if: >-
      vars.PUBLISH_ENABLED == 'true' &&
      needs.release-please.outputs.release_created != 'true' &&
      needs.check-npm-tag.outputs.has-latest == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm-next
      url: https://www.npmjs.com/package/firefly-audio-video/v/${{ steps.version.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - name: compute the next prerelease version
        id: version
        run: |
          base="$(node -p "require('./package.json').version")"
          IFS='.' read -r major minor patch <<< "$base"
          sha7="${GITHUB_SHA:0:7}"
          version="${major}.${minor}.$((patch + 1))-next.${GITHUB_RUN_NUMBER}.g${sha7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # The version is set before the build, in both places it lives:
      # package.json, which npm publishes under, and the VERSION literal in
      # src/version.ts, which the build bakes into the package: `dgr -V`
      # prints it, and the keys each copy of the package shares in one
      # process carry it. Neither change is committed, so the repository keeps
      # its release-please-owned version.
      - run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version
      - name: stamp the prerelease version into src/version.ts
        run: sed -i -E "s/^export const VERSION = '[^']*';/export const VERSION = '${VERSION}';/" src/version.ts
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - run: npm run build
      - name: check the built package reports the prerelease version
        run: |
          built="$(node dist/cli.cjs --version)"
          if [ "$built" != "$VERSION" ]; then
            echo "::error::the built package reports ${built}, not ${VERSION}"
            exit 1
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - run: npm publish --provenance --tag next --access public
