name: scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '43 5 * * 2'

# Scorecard's own publishing API enforces this shape on the producing
# workflow and will reject a run that doesn't match it: no top-level env or
# defaults, no workflow-level write permissions, and only the job running
# ossf/scorecard-action may hold id-token: write.
permissions: read-all

jobs:
  analyze:
    name: analyze
    # Scorecard is free on a public repository; on a private one it needs
    # GitHub Advanced Security, which this repository does not have while it
    # is still private, so the job stays off until the flip.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
